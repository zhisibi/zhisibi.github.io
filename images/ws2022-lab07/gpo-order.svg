<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <defs>
    <style>
      .box { fill: #f5f7fa; stroke: #4a6fa5; stroke-width: 2; }
      .gpo { fill: #e8f0fe; stroke: #1a3a6b; stroke-width: 2; }
      .win { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 2; }
      .t { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #1f2937; }
      .s { font-family: sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #4a6fa5; stroke-width: 2; }
      .ord { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>
  <text class="t" x="10" y="25" style="font-size:15px">GPO 处理顺序 LSDOU：后应用的覆盖先应用的</text>
  <g>
    <rect class="box" x="10" y="45" width="140" height="70" rx="10"/>
    <circle cx="30" cy="65" r="13" fill="#9e9e9e"/><text class="ord" x="25" y="70">1</text>
    <text class="t" x="50" y="70">本地策略</text>
    <text class="s" x="18" y="94">gpedit.msc 单机</text>
  </g>
  <g>
    <rect class="box" x="165" y="45" width="140" height="70" rx="10"/>
    <circle cx="185" cy="65" r="13" fill="#9e9e9e"/><text class="ord" x="180" y="70">2</text>
    <text class="t" x="205" y="70">站点 Site</text>
    <text class="s" x="173" y="94">多站点才用得上</text>
  </g>
  <g>
    <rect class="gpo" x="320" y="45" width="170" height="70" rx="10"/>
    <circle cx="340" cy="65" r="13" fill="#4a6fa5"/><text class="ord" x="335" y="70">3</text>
    <text class="t" x="360" y="70">域 Domain</text>
    <text class="s" x="328" y="94">Default Domain Policy</text>
  </g>
  <g>
    <rect class="gpo" x="505" y="45" width="245" height="70" rx="10"/>
    <circle cx="525" cy="65" r="13" fill="#4a6fa5"/><text class="ord" x="520" y="70">4</text>
    <text class="t" x="545" y="70">OU（父→子）</text>
    <text class="s" x="513" y="94">部门OU → 技术部OU（最后生效）</text>
  </g>
  <line class="line" x1="150" y1="80" x2="165" y2="80"/>
  <line class="line" x1="305" y1="80" x2="320" y2="80"/>
  <line class="line" x1="490" y1="80" x2="505" y2="80"/>
  <text class="s" x="10" y="135" style="font-size:12px">⬆ 应用顺序：1→2→3→4，同一个设置冲突时 4 号赢</text>
  <g>
    <rect class="box" x="10" y="150" width="740" height="195" rx="10" style="fill:#fff8e1"/>
    <text class="t" x="25" y="176">权力游戏：继承 / 阻止继承 / 强制</text>
    <g>
      <rect class="box" x="25" y="190" width="220" height="140" rx="8"/>
      <text class="t" x="40" y="214">继承（默认）</text>
      <text class="s" x="40" y="236">父OU的GPO自动传给子OU</text>
      <text class="s" x="40" y="256">部门OU的壁纸GPO</text>
      <text class="s" x="40" y="276">→ 技术部OU自动继承</text>
      <text class="s" x="40" y="300">权力：⭐⭐</text>
    </g>
    <g>
      <rect class="box" x="265" y="190" width="220" height="140" rx="8"/>
      <text class="t" x="280" y="214">阻止继承</text>
      <text class="s" x="280" y="236">子OU拒绝接收父OU的GPO</text>
      <text class="s" x="280" y="256">技术部OU上点"阻止继承"</text>
      <text class="s" x="280" y="276">→ 壁纸GPO不再下来</text>
      <text class="s" x="280" y="300">权力：⭐⭐⭐</text>
    </g>
    <g>
      <rect class="win" x="505" y="190" width="220" height="140" rx="8"/>
      <text class="t" x="520" y="214">强制（Enforced）</text>
      <text class="s" x="520" y="236">父OU的GPO强制穿透</text>
      <text class="s" x="520" y="256">部门OU的GPO勾"强制"</text>
      <text class="s" x="520" y="276">→ 阻止继承也挡不住</text>
      <text class="s" x="520" y="300">权力：⭐⭐⭐⭐ 👑</text>
    </g>
  </g>
</svg>
