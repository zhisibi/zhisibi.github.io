<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
  <defs>
    <style>
      .box { fill: #f5f7fa; stroke: #4a6fa5; stroke-width: 2; }
      .dec { fill: #fff8e1; stroke: #f9a825; stroke-width: 2; }
      .deny { fill: #ffebee; stroke: #c62828; stroke-width: 2; }
      .ok { fill: #e6f4ea; stroke: #2e7d32; stroke-width: 2; }
      .t { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #1f2937; }
      .s { font-family: sans-serif; font-size: 11px; fill: #4b5563; }
      .line { stroke: #4a6fa5; stroke-width: 2; }
      .ylbl { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #2e7d32; }
      .nlbl { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #c62828; }
    </style>
  </defs>
  <text class="t" x="10" y="25" style="font-size:15px">NTFS 权限判定流程：用户访问文件/文件夹时 Windows 的真实逻辑</text>
  <g><rect class="box" x="280" y="45" width="200" height="44" rx="8"/>
    <text class="t" x="300" y="72">用户发起访问请求</text></g>
  <line class="line" x1="380" y1="89" x2="380" y2="110"/>
  <g><rect class="dec" x="255" y="110" width="250" height="56" rx="8"/>
    <text class="t" x="275" y="132">有"拒绝" ACE 命中？</text>
    <text class="s" x="275" y="150">含用户自身或其所在组</text></g>
  <line class="line" x1="505" y1="138" x2="580" y2="138"/>
  <text class="ylbl" x="512" y="130">是</text>
  <g><rect class="deny" x="580" y="110" width="160" height="56" rx="8"/>
    <text class="t" x="600" y="134" style="fill:#c62828">⛔ 拒绝访问</text>
    <text class="s" x="600" y="152">Deny 永远优先</text></g>
  <line class="line" x1="380" y1="166" x2="380" y2="190"/>
  <text class="nlbl" x="388" y="182">否</text>
  <g><rect class="dec" x="255" y="190" width="250" height="56" rx="8"/>
    <text class="t" x="275" y="212">有"允许" ACE 命中？</text>
    <text class="s" x="275" y="230">且覆盖请求的操作</text></g>
  <line class="line" x1="505" y1="218" x2="580" y2="218"/>
  <text class="ylbl" x="512" y="210">是</text>
  <g><rect class="ok" x="580" y="190" width="160" height="56" rx="8"/>
    <text class="t" x="600" y="214" style="fill:#2e7d32">✅ 允许访问</text>
    <text class="s" x="600" y="232">按允许的权限放行</text></g>
  <line class="line" x1="380" y1="246" x2="380" y2="270"/>
  <text class="nlbl" x="388" y="262">否</text>
  <g><rect class="deny" x="280" y="270" width="200" height="44" rx="8"/>
    <text class="t" x="300" y="297" style="fill:#c62828">⛔ 默认拒绝</text></g>
  <text class="s" x="10" y="322">网络共享访问 = 先过共享权限这道门，再走上面整个流程（取最严交集）</text>
</svg>
